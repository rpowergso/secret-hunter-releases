name: Report a bug
description: Report a problem with Secret Hunter.
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Reports are public. Remove private links, room codes, tokens, and personal information from screenshots or logs.
  - type: input
    id: setup
    attributes:
      label: Setup
      description: "Plugin, Minecraft, Paper, and Java versions"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
